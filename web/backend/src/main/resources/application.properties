# Spring Boot Web Application Properties
server.port=8080
spring.application.name=online-examination-web-backend

# Database Connectivity (Reusing online_exam_db)
spring.datasource.url=jdbc:mysql://localhost:3306/online_exam_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:2005}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JWT Authentication
jwt.secret=${JWT_SECRET:OnlineExamSecretKeyForJwtSigningMustBeAtLeast256BitsLongForHmacSha256!}
jwt.expiration-ms=86400000

# Admin Registration Security (Configurable via Environment Variable)
admin.invitation-code=${ADMIN_INVITATION_CODE:ADMIN-EXAM-SECURE-2026}

# AI Configuration (Configurable via Environment Variables)
ai.provider=${AI_PROVIDER:AUTO}
ai.api-key=${AI_API_KEY:}
ai.model=${AI_MODEL:gemini-1.5-flash}

# File Upload Limit
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
