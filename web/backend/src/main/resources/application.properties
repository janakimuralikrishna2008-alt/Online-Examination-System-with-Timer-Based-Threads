# ===================================================================
# Online Examination System - Spring Boot Web Application Properties
# ===================================================================

# Server Port (Render sets $PORT dynamically; fallback to 8080)
server.port=${PORT:8080}
spring.application.name=online-examination-web-backend

# ===================================================================
# Database Connectivity (Cloud MySQL via Environment Variables)
# Supports DB_URL, DATABASE_URL, SPRING_DATASOURCE_URL
# ===================================================================
spring.datasource.url=${DB_URL:${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/online_exam_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}}
spring.datasource.username=${DB_USER:${DATABASE_USERNAME:root}}
spring.datasource.password=${DB_PASSWORD:${DATABASE_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# Security & Authentication
# Configured via Environment Variables for Production
# ===================================================================
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Administrator Invitation Code (Set ADMIN_INVITATION_CODE in production)
admin.invitation-code=${ADMIN_INVITATION_CODE:}

# ===================================================================
# CORS Allowed Origins
# Defaults allow localhost, *.pages.dev (Cloudflare Pages), *.onrender.com (Render)
# Customize via CORS_ALLOWED_ORIGINS environment variable
# ===================================================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# ===================================================================
# AI Question Drafting Configuration
# ===================================================================
ai.provider=${AI_PROVIDER:AUTO}
ai.api-key=${AI_API_KEY:}
ai.model=${AI_MODEL:gemini-1.5-flash}

# ===================================================================
# File Upload Limit
# ===================================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
