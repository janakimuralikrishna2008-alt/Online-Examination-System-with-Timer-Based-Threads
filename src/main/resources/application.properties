# ===================================================================
# Online Examination System Configuration
# ===================================================================

# Application Information
app.name=Online Examination System with Timer-Based Threads
app.version=1.0.0

# ===================================================================
# Database Configuration
# ===================================================================

# MySQL Server
db.host=localhost
db.port=3306
db.name=online_exam_db

# JDBC Connection URL
db.url=jdbc:mysql://localhost:3306/online_exam_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

# Database Username
db.user=root

# ===================================================================
# Database Security
# ===================================================================

# Do not store your MySQL password in this file.
# Configure the DB_PASSWORD environment variable instead.
db.password=

# Environment variables should take precedence:
# DB_URL
# DB_USER
# DB_PASSWORD

# ===================================================================
# End of Configuration
# ===================================================================