# ===================================================================
# Online Examination System with Timer-Based Threads
# Render Blueprint Specification (render.yaml) - All-in-One ₹0 Setup
# ===================================================================
services:
  # -----------------------------------------------------------------
  # Spring Boot REST Backend + Embedded MySQL (All-in-One Container)
  # -----------------------------------------------------------------
  - type: web
    name: online-examination-backend
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: CORS_ALLOWED_ORIGINS
        value: https://online-examination-system-with-time.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_INVITATION_CODE
        generateValue: true
