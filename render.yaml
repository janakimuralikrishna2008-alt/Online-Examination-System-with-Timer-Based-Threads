# ===================================================================
# Online Examination System with Timer-Based Threads
# Render Blueprint Specification (render.yaml)
# ===================================================================
services:
  # -----------------------------------------------------------------
  # 1. Spring Boot REST Backend Service
  # -----------------------------------------------------------------
  - type: web
    name: online-examination-backend
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: DB_URL
        sync: false
        # Example: jdbc:mysql://your-db-host:3306/online_exam_db?useSSL=true&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_INVITATION_CODE
        sync: false
        # Generate or enter your custom administrator invitation code
      - key: CORS_ALLOWED_ORIGINS
        sync: false
        # Example: https://online-examination-system.pages.dev

